# @file ci.yml
# @brief Cross-platform GPUI Kit validation
# @author modolet <y@xxyx.io>
# @date 2026-09-07
name: CI
on:
  push:
    branches: [main, master, codex/gpui-kit]
  pull_request:
  workflow_dispatch:
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        features: ["", "--features gpui_component_theme"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libfontconfig1-dev libfreetype6-dev libssl-dev libwayland-dev libx11-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev libegl1-mesa-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo check --all-targets ${{ matrix.features }}
      - run: cargo clippy --all-targets ${{ matrix.features }} -- -D warnings
      - run: cargo test --all-targets ${{ matrix.features }}
      - run: cargo check --examples ${{ matrix.features }}

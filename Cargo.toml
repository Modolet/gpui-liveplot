[package]
name = "gpui-liveplot"
version = "0.2.6"
edition = "2024"
rust-version = "1.85"
description = "High-performance append-only plotting for GPUI applications."
license = "MIT"
repository = "https://github.com/Modolet/gpui-liveplot"
homepage = "https://github.com/Modolet/gpui-liveplot"
documentation = "https://docs.rs/gpui-liveplot"
readme = "README.md"
keywords = ["gpui", "plot", "telemetry", "streaming", "visualization"]
categories = ["gui", "visualization"]

[lib]
path = "src/lib.rs"

[features]
default = []
gpui_component_theme = ["dep:gpui-component"]

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed" }
gpui-component = { git = "https://github.com/longbridge/gpui-component", optional = true, default-features = false }

[dev-dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed", version = "0.1.0", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
